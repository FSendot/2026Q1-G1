name: Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir "apply" para confirmar el deploy'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      BOOTSTRAP_EMAIL: ${{ secrets.BOOTSTRAP_EMAIL }}
      BOOTSTRAP_ALERT_EMAIL: ${{ secrets.BOOTSTRAP_ALERT_EMAIL }}
      BOOTSTRAP_PASSWORD: ${{ secrets.BOOTSTRAP_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/results_writer/go.mod
          cache-dependency-path: app/results_writer/go.sum

      - name: Build Lambda layers
        run: make build-layers

      - name: Build results-writer Lambda
        run: make build-results-writer

      - name: Init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="itba-tp-fraud-tfstate-${ACCOUNT_ID}"
          aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null || \
            aws s3api create-bucket --bucket "${BUCKET}" --region us-east-1
          aws s3api put-bucket-versioning \
            --bucket "${BUCKET}" \
            --versioning-configuration Status=Enabled
          terraform init -migrate-state -force-copy -backend-config="bucket=${BUCKET}"

      - name: Apply
        run: terraform apply -auto-approve

      - name: Bootstrap dashboard admin
        if: env.BOOTSTRAP_EMAIL != ''
        run: make bootstrap-auth
