name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir "apply" para aplicar solo infraestructura (sin imagen ni dashboard)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    name: Infrastructure only
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'

    env:
      AWS_REGION: us-east-1
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      BOOTSTRAP_EMAIL: ${{ secrets.BOOTSTRAP_EMAIL }}
      BOOTSTRAP_ALERT_EMAIL: ${{ secrets.BOOTSTRAP_ALERT_EMAIL }}
      BOOTSTRAP_PASSWORD: ${{ secrets.BOOTSTRAP_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/results_writer/go.mod
          cache-dependency-path: app/results_writer/go.sum

      - name: Build Lambda layers
        run: make build-layers

      - name: Build results-writer Lambda
        run: make build-results-writer

      - name: Initialize Terraform
        run: make init

      - name: Apply
        run: terraform apply -auto-approve

      - name: Bootstrap dashboard admin
        if: env.BOOTSTRAP_EMAIL != ''
        run: make bootstrap-auth

      - name: Write deployment summary
        run: |
          {
            echo "## Infrastructure outputs"
            echo ""
            echo "> **Nota:** este workflow no despliega la imagen del processor ni el dashboard estático en S3."
            echo "> Sin \`image_uri\`, ECS puede quedar en \`:placeholder\`. Para la stack completa, usar el workflow **Deploy**."
            echo ""
            echo "| Output | Value |"
            echo "|--------|-------|"
            echo "| dashboard_url | \`$(terraform output -raw dashboard_url)\` |"
            echo "| dashboard_app_url | \`$(terraform output -raw dashboard_app_url)\` |"
            echo "| api_endpoint | \`$(terraform output -raw api_endpoint)\` |"
            echo "| queue_url | \`$(terraform output -raw queue_url)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
