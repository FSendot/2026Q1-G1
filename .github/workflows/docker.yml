name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/processor/**"
      - "app/api/**"
      - "app/dashboard/**"
      - "app/net/serving/go/**"
      - "modules/api/**"
      - "modules/dashboard/**"
      - ".github/workflows/docker.yml"
      - "main.tf"
      - "variables.tf"
      - "outputs.tf"
  push:
    branches:
      - main
    paths:
      - "app/processor/**"
      - "app/api/**"
      - "app/dashboard/**"
      - "app/net/serving/go/**"
      - "modules/api/**"
      - "modules/dashboard/**"
      - ".github/workflows/docker.yml"
      - "main.tf"
      - "variables.tf"
      - "outputs.tf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare runtime spec
        run: make prepare-model

      - name: Build processor image
        run: docker build -f app/processor/Dockerfile -t "fraud-worker:${GITHUB_SHA}" app

      - name: Build API image
        run: docker build -f app/api/Dockerfile -t "fraud-api:${GITHUB_SHA}" app

      - name: Build dashboard static export
        if: github.ref != 'refs/heads/main'
        run: |
          docker build \
            -f app/dashboard/Dockerfile \
            --target export \
            --output type=local,dest=dashboard-dist \
            app

      - name: Set up Terraform
        if: github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        if: github.ref == 'refs/heads/main'
        run: make init

      - name: Read ECR repository URL
        if: github.ref == 'refs/heads/main'
        id: ecr
        run: echo "url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Tag processor image for ECR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.url }}:processor-${GITHUB_SHA}"
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.url }}:processor-latest"
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.url }}:${GITHUB_SHA}"
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.url }}:latest"

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          registry="${{ steps.ecr.outputs.url }}"
          registry="${registry%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"

      - name: Push processor image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.ecr.outputs.url }}:processor-${GITHUB_SHA}"
          docker push "${{ steps.ecr.outputs.url }}:processor-latest"
          docker push "${{ steps.ecr.outputs.url }}:${GITHUB_SHA}"
          docker push "${{ steps.ecr.outputs.url }}:latest"

      - name: Terraform plan
        if: github.ref == 'refs/heads/main'
        run: |
          terraform plan \
            -out=tfplan \
            -var "image_uri=${{ steps.ecr.outputs.url }}:processor-${GITHUB_SHA}"

      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Read dashboard deployment outputs
        if: github.ref == 'refs/heads/main'
        id: dashboard
        run: |
          echo "bucket=$(terraform output -raw dashboard_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"

      - name: Build dashboard for S3
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            -f app/dashboard/Dockerfile \
            --target export \
            --build-arg "API_BASE=${{ steps.dashboard.outputs.api_endpoint }}" \
            --output type=local,dest=dashboard-dist \
            app

      - name: Deploy dashboard to S3
        if: github.ref == 'refs/heads/main'
        run: aws s3 sync dashboard-dist "s3://${{ steps.dashboard.outputs.bucket }}/" --delete
