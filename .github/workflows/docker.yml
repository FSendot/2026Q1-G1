name: Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/processor/**"
      - "app/api/**"
      - "app/dashboard/**"
      - "app/net/serving/go/**"
      - "modules/api/**"
      - "modules/dashboard/**"
      - ".github/workflows/docker.yml"
      - "main.tf"
      - "variables.tf"
      - "outputs.tf"
  push:
    branches:
      - main
    paths:
      - "app/processor/**"
      - "app/api/**"
      - "app/dashboard/**"
      - "app/net/serving/go/**"
      - "modules/api/**"
      - "modules/dashboard/**"
      - ".github/workflows/docker.yml"
      - "main.tf"
      - "variables.tf"
      - "outputs.tf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare runtime spec
        run: make prepare-model

      - name: Build processor image
        run: docker build -f app/processor/Dockerfile -t "fraud-worker:${GITHUB_SHA}" app

      - name: Build API image
        run: docker build -f app/api/Dockerfile -t "fraud-api:${GITHUB_SHA}" app

      - name: Build dashboard static export
        if: github.ref != 'refs/heads/main'
        run: |
          docker build \
            -f app/dashboard/Dockerfile \
            --target export \
            --output type=local,dest=dashboard-dist \
            app

      - name: Set up Terraform
        if: github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda layers
        if: github.ref == 'refs/heads/main'
        run: make build-layers

      - name: Initialize Terraform
        if: github.ref == 'refs/heads/main'
        run: make init

      - name: Bootstrap ECR repository
        if: github.ref == 'refs/heads/main'
        run: |
          terraform output -raw ecr_repository_url >/tmp/ecr_repository_url 2>/dev/null || true
          if grep -Eq '^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+' /tmp/ecr_repository_url; then
            exit 0
          fi

          echo "No ECR repository output found yet; applying Terraform once with the placeholder image to create repository resources."
          terraform plan -out=tfplan-bootstrap
          terraform apply -auto-approve tfplan-bootstrap

      - name: Read ECR image metadata
        if: github.ref == 'refs/heads/main'
        id: ecr
        run: |
          terraform output -raw ecr_repository_url >/tmp/ecr_repository_url 2>/dev/null || true
          ecr_url="$(grep -E '^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+' /tmp/ecr_repository_url | tail -n 1)"
          if [ -z "$ecr_url" ]; then
            echo "Terraform output ecr_repository_url is empty after bootstrap apply." >&2
            echo "Raw terraform output was:" >&2
            cat /tmp/ecr_repository_url >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::12}"
          processor_tag="processor-${short_sha}"

          echo "url=${ecr_url}" >> "$GITHUB_OUTPUT"
          echo "registry=${ecr_url%%/*}" >> "$GITHUB_OUTPUT"
          echo "processor_tag=${processor_tag}" >> "$GITHUB_OUTPUT"
          echo "processor_image=${ecr_url}:${processor_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main'
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.ecr.outputs.registry }}"

      - name: Tag processor image for ECR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.processor_image }}"
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.url }}:processor-latest"
          docker tag "fraud-worker:${GITHUB_SHA}" "${{ steps.ecr.outputs.url }}:latest"

      - name: Push processor image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.ecr.outputs.processor_image }}"
          docker push "${{ steps.ecr.outputs.url }}:processor-latest"
          docker push "${{ steps.ecr.outputs.url }}:latest"

      - name: Terraform plan
        if: github.ref == 'refs/heads/main'
        run: |
          terraform plan \
            -out=tfplan \
            -var "image_uri=${{ steps.ecr.outputs.processor_image }}"

      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Read dashboard deployment outputs
        if: github.ref == 'refs/heads/main'
        id: dashboard
        run: |
          echo "bucket=$(terraform output -raw dashboard_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"

      - name: Build dashboard for S3
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            -f app/dashboard/Dockerfile \
            --target export \
            --build-arg "API_BASE=${{ steps.dashboard.outputs.api_endpoint }}" \
            --output type=local,dest=dashboard-dist \
            app

      - name: Deploy dashboard to S3
        if: github.ref == 'refs/heads/main'
        run: aws s3 sync dashboard-dist "s3://${{ steps.dashboard.outputs.bucket }}/" --delete
