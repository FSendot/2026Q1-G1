name: Send test transactions

on:
  workflow_dispatch:
    inputs:
      count:
        description: Cantidad de transacciones a generar y encolar en el pico.
        required: true
        default: "50000"
      fraud_pct:
        description: Porcentaje de transacciones con patrón de fraude (0–100).
        required: true
        default: "8"
      concurrency:
        description: Workers paralelos en el EC2 on-prem que envían lotes a SQS.
        required: true
        default: "128"

jobs:
  send-test-transactions:
    name: Send test transactions
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      ONPREM_STACK: itba-tp-fraud-onprem-strongswan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade boto3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        run: make init

      - name: Send transactions
        run: |
          python scripts/send_test_transactions.py \
            --stack "${ONPREM_STACK}" \
            --region "${AWS_DEFAULT_REGION}" \
            --count "${{ inputs.count }}" \
            --fraud-pct "${{ inputs.fraud_pct }}" \
            --concurrency "${{ inputs.concurrency }}"
