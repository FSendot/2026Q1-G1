name: Send test transactions

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of transactions to enqueue.
        required: true
        default: "50000"
      fraud_pct:
        description: Percentage of transactions using the fraud pattern.
        required: true
        default: "20"
      concurrency:
        description: Concurrent SQS batch sender workers on the on-prem EC2.
        required: true
        default: "128"
      region:
        description: AWS region.
        required: true
        default: us-east-1
      stack:
        description: CloudFormation stack name for the on-prem EC2 instance.
        required: true
        default: itba-tp-fraud-onprem-strongswan
      queue_url:
        description: Optional SQS queue URL override. Leave empty to read terraform output.
        required: false
        default: ""
      instance_id:
        description: Optional EC2 instance ID override. Leave empty to read CloudFormation output.
        required: false
        default: ""

jobs:
  send-test-transactions:
    name: Send test transactions
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ inputs.region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade boto3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        if: ${{ inputs.queue_url == '' }}
        run: make init

      - name: Send transactions
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --stack "${{ inputs.stack }}"
            --region "${{ inputs.region }}"
            --count "${{ inputs.count }}"
            --fraud-pct "${{ inputs.fraud_pct }}"
            --concurrency "${{ inputs.concurrency }}"
          )

          if [ -n "${{ inputs.queue_url }}" ]; then
            args+=(--queue-url "${{ inputs.queue_url }}")
          fi

          if [ -n "${{ inputs.instance_id }}" ]; then
            args+=(--instance-id "${{ inputs.instance_id }}")
          fi

          python scripts/send_test_transactions.py "${args[@]}"
