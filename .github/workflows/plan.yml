name: Plan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="itba-tp-fraud-tfstate-${ACCOUNT_ID}"
          aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null || \
            aws s3api create-bucket --bucket "${BUCKET}" --region us-east-1
          aws s3api put-bucket-versioning \
            --bucket "${BUCKET}" \
            --versioning-configuration Status=Enabled
          terraform init -migrate-state -force-copy -backend-config="bucket=${BUCKET}"

      - name: Plan
        run: terraform plan -no-color 2>&1 | tee plan_output.txt

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const max = 65000;
            const body = '## Terraform Plan\n```\n' +
              (plan.length > max ? plan.slice(0, max) + '\n…(recortado)' : plan) +
              '\n```';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ github.run_id }}
          path: plan_output.txt
          retention-days: 7
